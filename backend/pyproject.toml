[project]
name = "deardish-backend"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "embar==0.4.0",
    "fastapi==0.161.1",
    "langchain==1.4.7",
    "langchain-openrouter==0.2.9",
    "psycopg[binary,pool]==3.3.6",
    "uvicorn[standard]>=0.41,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.15,<1",
    "ty>=0.0.1a0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.14"
